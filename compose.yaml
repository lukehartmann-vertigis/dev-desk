services:
    app:
        image: devdesk:local
        build: .
        init: true
        restart: unless-stopped
        stop_grace_period: 30s
        ports:
            - '127.0.0.1:3000:3000'
        env_file:
            - path: .env
              required: false
        volumes:
            - devdesk-data:/data
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
volumes:
    devdesk-data:
